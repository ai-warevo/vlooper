[project]
name = "vlooper"
version = "0.1.0"
description = "AI Git-Flow automation daemon (vLooper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
vlooper = "vlooper.daemon:main"
check = "check:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.4.0",
    "pylint>=4.1.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Configuration for Ruff

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["I001", "RUF059"]

[tool.mypy]
# Configuration for Mypy
[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[tool.black]
target-version = ["py312"]

[tool.pylint.messages_control]
disable = [
    "broad-exception-caught",
]

[tool.pylint.design]
min-public-methods = 1
